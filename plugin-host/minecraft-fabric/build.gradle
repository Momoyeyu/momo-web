plugins { id 'fabric-loom' version '1.7.4' }
version = '0.1.0'
group = 'dev.momo'
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.4+1.21.1'
 modImplementation files('deps/baritone-api-fabric-1.11.3.jar')

}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

// The pinned upstream is already an intermediary Fabric mod; preserve its nested jars.
tasks.named('jar') {
 from('deps/baritone-api-fabric-1.11.3.jar') { into 'META-INF/jars' }
}



tasks.register('taskRuntimeSmoke', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.momo.task.TaskRuntimeSmoke'
}
check.dependsOn taskRuntimeSmoke

tasks.register('taskPlanSmoke', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.momo.task.TaskPlanSmoke'
}
check.dependsOn taskPlanSmoke

tasks.named('processResources') {
 from('../src/minecraft-skills.json') { rename { 'momo-skills.json' } }
}
tasks.register('skillArgumentsSmoke', JavaExec) {
