[project]
name = "momo-web-backend"
version = "0.1.0"
description = "momo-web FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "httpx>=0.27",
    "sqlite-vec>=0.1",
    "pyyaml>=6.0.3",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core==1.13.8",
    "onnxruntime>=1.31.0",
    "websockets>=17.2",
    "tokenizers>=0.23.3",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["bundled_model: opt-in offline inference against bundled assets"]
