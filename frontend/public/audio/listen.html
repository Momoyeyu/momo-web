<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>momo · Phase & Presence</title><style>body{background:#19161f;color:#eee9dc;font:16px system-ui;margin:48px auto;padding:0 24px;max-width:1000px}h1{font-weight:500;color:#e8bd6c}p,small{color:#aaa2b3;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:#292430;padding:24px;border:1px solid #4a414e;border-radius:16px}audio{width:100%;margin:8px 0 16px}h2{font-size:18px}a{color:#e8bd6c}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><h1>Phase & Presence</h1><p id="intro">momo 原创纯音乐 · 六首情境配乐。游戏循环版与独立 OST 编排可分别试听。</p><div class="grid" id="tracks"></div><h2>Sound palette</h2><div class="grid"><section><h2>A · Warm pulse</h2><audio controls preload="none" src="warm-preview.wav"></audio></section><section><h2>B · Soft glass</h2><audio controls preload="none" src="glass-preview.wav"></audio></section></div><script>
const lang=navigator.language.startsWith('zh')?'zh':navigator.language.startsWith('ja')?'ja':'en';
const words={zh:['游戏循环','OST 完整版','momo 原创纯音乐 · 六首情境配乐。游戏循环版与独立 OST 编排可分别试听。'],en:['Game loop','Full OST','momo original instrumentals · Six scenes, with separate game loops and complete OST arrangements.'],ja:['ゲーム用ループ','OST フルバージョン','momo オリジナル音楽 · 6曲のゲーム用ループと独立したOSTアレンジ。']}[lang];document.documentElement.lang=lang;document.getElementById('intro').textContent=words[2];
const setup=a=>{a.volume=.5;a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(b=>{if(b!==a)b.pause()}))};document.querySelectorAll('audio').forEach(setup);
fetch('manifest.json').then(r=>r.json()).then(m=>{for(const [id,t] of Object.entries(m.music)){const s=document.createElement('section');const h=document.createElement('h2');h.textContent=lang==='zh'?t.title:t.titleEn;s.append(h);for(const [index,file] of [t.file,id+'-ost.mp3'].entries()){const label=document.createElement('small');label.textContent=words[index];const a=document.createElement('audio');a.controls=true;a.preload='none';a.loop=index===0;a.src=file;a.setAttribute('aria-label',h.textContent+' '+label.textContent);setup(a);s.append(label,a)}document.getElementById('tracks').append(s)}}).catch(()=>{document.getElementById('intro').textContent='Audio unavailable — reload to retry.'});
</script></html>
